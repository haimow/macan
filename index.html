<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maçan Real Estate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #C9A84C; --dark: #0C1710; }
    body { background: var(--dark); width: 100vw; height: 100vh; overflow: hidden; font-family: 'Georgia', serif; }
    #stage { position: fixed; inset: 0; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease-in-out; display: flex; align-items: center; justify-content: center; background: var(--dark); }
    .slide.active { opacity: 1; z-index: 2; }
    .slide img { width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
    .slide video { width: 100%; height: 100%; object-fit: cover; background: var(--dark); }
    #vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); pointer-events: none; z-index: 10; }
    #progress { position: fixed; bottom: 0; left: 0; height: 2px; background: var(--gold); z-index: 30; }
    #dots { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 30; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(201,168,76,0.25); border: 1px solid rgba(201,168,76,0.5); cursor: pointer; transition: background 0.4s, transform 0.4s; }
    .dot.active { background: var(--gold); transform: scale(1.5); }
    #watermark { position: fixed; bottom: 32px; right: 40px; z-index: 20; text-align: right; opacity: 0.4; pointer-events: none; }
    #watermark .wm-brand { font-size: 0.85rem; letter-spacing: 0.35em; color: var(--gold); }
    #watermark .wm-rule { height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); margin: 3px 0; opacity: 0.6; }
    #watermark .wm-sub { font-size: 0.55rem; letter-spacing: 0.28em; color: var(--gold); }

    #pause-badge { position: fixed; top: 22px; right: 22px; z-index: 30; padding: 7px 16px; border: 1px solid rgba(201,168,76,0.4); background: rgba(0,0,0,0.55); color: var(--gold); font-size: 0.65rem; letter-spacing: 0.2em; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #pause-badge.show { opacity: 1; }

  </style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="progress"></div>
<div id="dots"></div>
<div id="watermark">
  <div class="wm-brand">MAĆAN</div>
  <div class="wm-rule"></div>
  <div class="wm-sub">REAL ESTATE</div>
</div>
<div id="pause-badge">⏸ &nbsp;DURAKLATILDI</div>


<script>
/* ══════════════════════════════════════════════════════
   AYAR — sadece repo adını değiştirin, başka bir şey yok
   images/ klasörüne ne yüklerseniz otomatik görünür
   ══════════════════════════════════════════════════════ */
const REPO         = 'haimow/macan';
const IMAGES_DIR   = 'images';
const IMAGE_DUR    = 7; // resimler için bekleme süresi (saniye)
const REFRESH_MS   = 60 * 60 * 1000; // yeni dosyalar için saatte bir kontrol

const MEDIA_EXTS   = /\.(mp4|webm|mov|ogg|jpg|jpeg|png|webp|gif)$/i;
const VIDEO_EXTS   = /\.(mp4|webm|mov|ogg)$/i;

/* ─── DOM ─── */
const stage      = document.getElementById('stage');
const dotsEl     = document.getElementById('dots');
const progressEl = document.getElementById('progress');
const pauseBadge = document.getElementById('pause-badge');

let current   = 0;
let paused    = false;
let autoTimer = null;
let slides    = [];

/* ─── GitHub API'dan dosya listesi çek ─── */
async function fetchMediaList() {
  const url = `https://api.github.com/repos/${REPO}/contents/${IMAGES_DIR}`;
  const res  = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });
  if (!res.ok) throw new Error('GitHub API hatası: ' + res.status);
  const files = await res.json();
  return files
    .filter(f => f.type === 'file' && MEDIA_EXTS.test(f.name))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(f => ({ src: `${IMAGES_DIR}/${f.name}` }));
}

/* ─── Slaytları oluştur ─── */
function buildSlides(media) {
  // Temizle
  stage.innerHTML = '';
  dotsEl.innerHTML = '';
  slides = [];
  current = 0;

  media.forEach((item, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    if (VIDEO_EXTS.test(item.src)) {
      const v = document.createElement('video');
      v.src = item.src; v.muted = true; v.playsInline = true; v.preload = 'auto'; v.loop = false;
      v.addEventListener('ended', () => { if (!paused) advance(); });
      slide.appendChild(v);
    } else {
      const img = document.createElement('img'); img.src = item.src; img.alt = '';
      slide.appendChild(img);
    }
    stage.appendChild(slide); slides.push(slide);
    const dot = document.createElement('div'); dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i)); dotsEl.appendChild(dot);
  });

  goTo(0);
}

/* ─── Başlat ─── */
async function init() {
  try {
    const media = await fetchMediaList();
    if (!media.length) return;
    buildSlides(media);

    // Saatte bir yeni dosya kontrolü (sayfa yeniden yüklenmez, liste güncellenir)
    setInterval(async () => {
      try {
        const fresh = await fetchMediaList();
        if (fresh.length !== slides.length ||
            fresh.some((f, i) => f.src !== slides[i]?.querySelector('img,video')?.src?.split('/').slice(-2).join('/'))) {
          buildSlides(fresh);
        }
      } catch (_) {}
    }, REFRESH_MS);
  } catch (e) {
    console.error(e);
  }
}

function showSlide(i){
  const prev = slides[current]; const pv = prev && prev.querySelector('video');
  if(pv){ pv.pause(); pv.currentTime = 0; }
  slides.forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
  clearTimeout(autoTimer);
  current = ((i % slides.length) + slides.length) % slides.length;
  slides[current].classList.add('active');
  document.querySelectorAll('.dot')[current].classList.add('active');
  const cv = slides[current].querySelector('video');
  if(cv){
    progressEl.style.transition = 'none'; progressEl.style.width = '0%';
    cv.play().catch(()=>{});
    const startProg = () => {
      const dur = cv.duration || 10;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        progressEl.style.transition = `width ${dur}s linear`;
        progressEl.style.width = '100%';
      }));
    };
    if(cv.readyState >= 1) startProg();
    else cv.addEventListener('loadedmetadata', startProg, {once:true});
  } else {
    animateProgress(CONFIG.imageDuration);
    autoTimer = setTimeout(() => { if(!paused) advance(); }, CONFIG.imageDuration * 1000);
  }
}

function goTo(i){ showSlide(i); }
function advance(){ goTo(current + 1); }

function animateProgress(dur){
  progressEl.style.transition = 'none'; progressEl.style.width = '0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    progressEl.style.transition = `width ${dur}s linear`; progressEl.style.width = '100%';
  }));
}

function togglePause(){
  paused = !paused; pauseBadge.classList.toggle('show', paused);
  const cv = slides[current] && slides[current].querySelector('video');
  if(cv){ paused ? cv.pause() : cv.play(); }
  else {
    if(!paused) autoTimer = setTimeout(() => { if(!paused) advance(); }, CONFIG.imageDuration * 1000);
    else clearTimeout(autoTimer);
  }
}


document.addEventListener('keydown', e => {
  if(e.code==='Space'){ e.preventDefault(); togglePause(); }
  if(e.code==='ArrowRight'){ paused=false; advance(); }
  if(e.code==='ArrowLeft'){ paused=false; goTo(current-1); }
  if(e.code==='KeyF'||e.code==='F11'){ e.preventDefault(); !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); }
});

let tx=0;
document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx)>50){ paused=false; dx<0 ? advance() : goTo(current-1); }
  else togglePause();
});

init();
</script>
</body>
</html>
